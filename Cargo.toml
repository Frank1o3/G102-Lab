[package]
    description="Logitech HID++ discovery, inspection, and explicit controls"
    edition="2024"
    license="MIT"
    name="g102-control"
    rust-version="1.88"
    version="0.1.0"

[dependencies]
    hidapi={version="2.6.7", default-features=false, features=["linux-static-hidraw"]}
    serde={version="1.0.229", features=["derive"]}
    toml="1.2.1"

[[bin]]
    name="g102-control"
    path="src/main.rs"
